name: tests

# Exécute la qualité de code et les tests à chaque Pull Request, à chaque push sur main,
# ou à la demande. Le déclenchement manuel permet de démontrer qu'un test défaillant
# fait échouer le workflow (entrée « echec_volontaire »).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      echec_volontaire:
        description: "Active le test volontairement défaillant (le workflow doit échouer)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEMO_ECHEC: ${{ inputs.echec_volontaire && '1' || '0' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances figées
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff - analyse statique
        run: ruff check .

      - name: Ruff - formatage
        run: ruff format --check .

      - name: Pytest avec couverture
        run: >
          pytest
          --cov=app --cov=ml
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/htmlcov
          --cov-fail-under=90
          --junitxml=reports/junit.xml
          --resultats-json=reports/resultats_tests.json

      - name: Archiver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-qualite
          path: |
            reports/coverage.xml
            reports/htmlcov
            reports/junit.xml
            reports/resultats_tests.json
          if-no-files-found: warn
          retention-days: 14
